name: CI

on:
  # Qualquer push em qualquer branch.
  push:

  # PRs destinados às branches protegidas.
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # Permite execução manual pela interface do GitHub.
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

# Se outro commit chegar na mesma branch/PR, cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # PUSH VALIDATION
  #
  # Executado em qualquer git push, independentemente da branch.
  # Esses checks dão feedback antecipado, mas NÃO serão required checks de merge.
  # ===========================================================================

  push-quality:
    name: Push Quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Black
        run: black --check src test

      - name: isort
        run: isort --check-only src test

      - name: Flake8
        run: flake8 src test

      - name: MyPy strict
        run: mypy src --strict

      - name: Pre-commit
        run: pre-commit run --all-files

  push-security:
    name: Push Security
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      # SAST — Static Application Security Testing
      - name: Bandit SAST
        run: bandit -c pyproject.toml -r src

      # SCA — Software Composition Analysis
      - name: pip-audit SCA
        run: pip-audit

      # SBOM — Software Bill of Materials
      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment \
            --output-file artifacts/sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: push-sbom
          path: artifacts/sbom.json

  push-tests:
    name: Push Tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run test harness
        run: pytest test

  push-coverage:
    name: Push Coverage
    if: github.event_name == 'push'
    needs:
      - push-quality
      - push-security
      - push-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Coverage gate
        run: |
          pytest test \
            --cov=src \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=85

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: push-coverage-html
          path: htmlcov

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: push-coverage-xml
          path: coverage.xml

  # ===========================================================================
  # PULL REQUEST GATES
  #
  # Executados somente para PR -> dev ou PR -> main.
  # Estes serão posteriormente configurados como REQUIRED STATUS CHECKS.
  # ===========================================================================

  pr-quality:
    name: PR Quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Black
        run: black --check src test

      - name: isort
        run: isort --check-only src test

      - name: Flake8
        run: flake8 src test

      - name: MyPy strict
        run: mypy src --strict

      - name: Pre-commit
        run: pre-commit run --all-files

  pr-security:
    name: PR Security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Bandit SAST
        run: bandit -c pyproject.toml -r src

      - name: pip-audit SCA
        run: pip-audit

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment \
            --output-file artifacts/sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: pr-sbom
          path: artifacts/sbom.json

  pr-tests:
    name: PR Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run test harness
        run: pytest test

  pr-coverage:
    name: PR Coverage
    if: github.event_name == 'pull_request'
    needs:
      - pr-quality
      - pr-security
      - pr-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Coverage gate
        run: |
          pytest test \
            --cov=src \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=85

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: pr-coverage-html
          path: htmlcov

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: pr-coverage-xml
          path: coverage.xml
