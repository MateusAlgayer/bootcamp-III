[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bootcamp-iii"
version = "0.1.0"
description = "Repositório para tarefas relacionadas a disciplina de bootcamp III"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit",
]

[project.optional-dependencies]
dev = [
    # Tests
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",

    # Formatting / linting — toolchain original do projeto
    "black>=26.3.1,<27",
    "isort>=5.13,<7",
    "flake8>=7,<8",

    # Type checking
    "mypy>=1.18,<2",

    # Security / supply chain
    "bandit[toml]>=1.8,<2",
    "pip-audit>=2.7,<3",
    "cyclonedx-bom>=4.4,<8",

    # Git hooks
    "pre-commit>=4,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | htmlcov
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = [
    "controllers",
    "models",
    "repositories",
    "services",
    "shared",
    "views",
]
skip = [
    ".venv",
    "build",
    "dist",
]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
exclude = ["^test/"]

[tool.bandit]
targets = ["src"]
exclude_dirs = [".venv", "test"]
skips = ["B101"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: unit tests that do not depend on external services",
    "integration: integration tests that exercise the app end-to-end",
    "contract: tests that validate SDD contracts and domain invariants",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src"]
omit = ["test/*"]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
